    <script>
      // Runtime Environment: HMR is disabled in AI Studio preview.
      // Intercept Vite client WebSocket connection attempts to prevent unhandled 'WebSocket closed without opened' errors.
      (function () {
        const OriginalWebSocket = window.WebSocket;
        if (typeof OriginalWebSocket !== 'undefined') {
          window.WebSocket = function (url, protocols) {
            const urlStr = String(url || '');
            const isViteHmr =
              (protocols === 'vite-hmr') ||
              (Array.isArray(protocols) && protocols.includes('vite-hmr')) ||
              urlStr.includes('/@vite/') ||
              urlStr.includes('vite') ||
              urlStr.includes('token=') ||
              (location.hostname && urlStr.includes(location.hostname));

            if (isViteHmr) {
              const listeners = { open: [], message: [], close: [], error: [] };
              const mock = {
                url: urlStr,
                protocols: protocols || '',
                readyState: 1, // OPEN
                binaryType: 'blob',
                bufferedAmount: 0,
                extensions: '',
                protocol: 'vite-hmr',
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
                send: function () {},
                close: function () {
                  mock.readyState = 3;
                },
                addEventListener: function (type, fn) {
                  if (listeners[type]) listeners[type].push(fn);
                },
                removeEventListener: function (type, fn) {
                  if (listeners[type]) {
                    const idx = listeners[type].indexOf(fn);
                    if (idx !== -1) listeners[type].splice(idx, 1);
                  }
                },
                dispatchEvent: function (ev) {
                  const fns = listeners[ev.type] || [];
                  for (const fn of fns) {
                    try { fn.call(mock, ev); } catch (e) {}
                  }
                  return true;
                }
              };

              setTimeout(function () {
                mock.readyState = 1;
                const ev = new Event('open');
                if (typeof mock.onopen === 'function') {
                  try { mock.onopen(ev); } catch (e) {}
                }
                mock.dispatchEvent(ev);
              }, 10);

              return mock;
            }

            return new OriginalWebSocket(url, protocols);
          };

          window.WebSocket.prototype = OriginalWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        window.addEventListener(
          'unhandledrejection',
          function (event) {
            const msg = String(event.reason?.message || event.reason || '');
            const stack = String(event.reason?.stack || '');
            if (
              msg.includes('WebSocket') ||
              stack.includes('WebSocket') ||
              stack.includes('createWebSocketModuleRunnerTransport') ||
              stack.includes('@vite/client')
            ) {
              event.preventDefault();
              if (typeof event.stopImmediatePropagation === 'function') {
                event.stopImmediatePropagation();
              }
            }
          },
          true
        );

        window.addEventListener(
          'error',
          function (event) {
            const msg = String(event.message || '');
            const file = String(event.filename || '');
            if (
              msg.includes('WebSocket') ||
              msg.includes('createWebSocketModuleRunnerTransport') ||
              file.includes('@vite/client')
            ) {
              event.preventDefault();
              if (typeof event.stopImmediatePropagation === 'function') {
                event.stopImmediatePropagation();
              }
            }
          },
          true
        );
      })();
    </script>
